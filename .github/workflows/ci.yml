# ── CI/CD Pipeline ──
# Runs on every push and PR to main
# Gates: type check → lint → build → eval tests
# Blocks merge if any gate fails

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check + Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate 1: TypeScript type check — catches type errors without building
      - name: Type check
        run: npx tsc --noEmit

      # Gate 2: ESLint — enforces code style and catches common bugs
      - name: Lint
        run: npm run lint

      # Gate 3: Production build — catches SSR errors, missing imports, bad configs
      - name: Build
        run: npm run build
        env:
          # Dummy env vars so build doesn't crash on missing secrets
          GEMINI_API_KEY: "dummy-for-build"
          BETTER_AUTH_SECRET: "dummy-secret-for-ci-build-only"
          TURSO_DATABASE_URL: "libsql://dummy"
          TURSO_AUTH_TOKEN: "dummy"
          UPSTASH_REDIS_REST_URL: "https://dummy"
          UPSTASH_REDIS_REST_TOKEN: "dummy"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  evals:
    name: AI Eval Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run AI evaluation tests — validates prompt schemas, output parsing, guardrails
      - name: Run eval suite
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test
