<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="108" fill="url(#shine)" opacity="0.4"/>
  <!-- Hanger hook (top arc) -->
  <path d="M256 100 C256 70, 296 60, 296 90" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Hanger body -->
  <path d="M160 200 L256 140 L352 200" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <!-- Shirt/top outline -->
  <path d="M180 200 L180 320 Q180 340 200 340 L312 340 Q332 340 332 320 L332 200" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>
  <!-- AI sparkle dots -->
  <circle cx="370" cy="160" r="8" fill="white" opacity="0.9"/>
  <circle cx="400" cy="130" r="5" fill="white" opacity="0.6"/>
  <circle cx="390" cy="180" r="4" fill="white" opacity="0.5"/>
  <!-- Bottom tagline bar -->
  <rect x="140" y="370" width="232" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="256" y="394" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="20" fill="white" letter-spacing="3">OOTD AI</text>
</svg>
